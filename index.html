<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オリンピック集計アプリ</title>
    <!-- 画像保存用ライブラリ html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #1e90ff;
            --success: #2ed573;
            --danger: #ff6b81;
            --dark: #2f3542;
            --light: #ffffff;
            --bg-grad: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        * { box-sizing: border-box; }
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background: var(--bg-grad); color: var(--dark); 
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* ビュー管理 */
        .view { display: none; padding: 10px; width: 100%; max-width: 500px; margin: 0 auto; flex: 1; }
        .view.active { display: flex; flex-direction: column; }

        .card { background: rgba(255, 255, 255, 0.95); border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h1, h2 { margin: 0 0 10px 0; text-align: center; color: var(--primary); font-size: 1.2rem; }
        
        /* 設定画面 */
        .rule-box { border-left: 4px solid var(--primary); background: #fff0f0; padding: 10px; font-size: 0.85rem; margin-bottom: 15px; }
        .config-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; }
        select, input { padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; width: 100%; }
        .name-inputs { display: grid; gap: 8px; margin-bottom: 15px; }
        
        .btn { width: 100%; padding: 12px; font-size: 1.1rem; font-weight: bold; color: #fff; background: var(--secondary); border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-submit { background: var(--primary); margin-top: auto; }
        .btn-save { background: var(--success); margin-top: 15px; }

        /* プレイ画面 (コンパクト化) */
        .play-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; border-bottom: 2px solid var(--secondary); padding-bottom: 5px; }
        .player-row { margin-bottom: 12px; border-bottom: 1px dashed #ccc; padding-bottom: 8px; }
        .player-name { font-weight: bold; margin-bottom: 5px; display: block; }
        .medal-grid { display: flex; gap: 4px; }
        .medal-btn { 
            flex: 1; padding: 8px 2px; font-size: 0.8rem; font-weight: bold; border: 1px solid #ccc; 
            border-radius: 6px; background: #f1f2f6; cursor: pointer; text-align: center; 
        }
        .medal-btn.selected { border-color: var(--primary); background: #ffeaa7; color: #d35400; box-shadow: inset 0 0 0 2px var(--primary); }
        
        /* ミニスコアボード */
        .mini-board { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 15px; }
        .mini-board th, .mini-board td { border: 1px solid #ddd; padding: 4px; text-align: center; }
        .mini-board th { background: #f8f9fa; }
        .net-plus { color: #0984e3; font-weight: bold; }
        .net-minus { color: #d63031; font-weight: bold; }

        /* 結果画面 */
        #capture-area { background: var(--bg-grad); padding: 10px; border-radius: 8px; }
        .detail-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; background: #fff; margin-bottom: 15px; }
        .detail-table th, .detail-table td { border: 1px solid #ccc; padding: 4px; text-align: center; }
        .detail-table th { background: #eee; }
    </style>
</head>
<body>

    <!-- 1. 設定画面 -->
    <div id="setup-view" class="view active">
        <div class="card">
            <h1>オリンピック集計</h1>
            <div class="rule-box">
                <b>【絶対条件】</b><br>
                グリーン上から<b>「1パット」でカップイン</b>した場合のみポイントが発生します。（ダイヤのみグリーン外からの直接カップイン）
            </div>
            
            <div class="config-row">
                <label>プレイ人数</label>
                <select id="player-count" style="width:50%;" onchange="renderNameInputs()">
                    <option value="4" selected>4人</option>
                    <option value="3">3人</option>
                    <option value="2">2人</option>
                </select>
            </div>
            <div class="config-row">
                <label>レート (1pt)</label>
                <select id="rate" style="width:50%;">
                    <script>
                        for(let i = 50; i <= 500; i += 50) document.write(`<option value="${i}" ${i===100?'selected':''}>${i}</option>`);
                    </script>
                </select>
            </div>

            <div class="name-inputs" id="name-inputs-container"></div>
            <button class="btn" onclick="startGame()">ゲーム開始</button>
        </div>
    </div>

    <!-- 2. プレイ画面 (1画面完結) -->
    <div id="play-view" class="view">
        <div class="card" style="flex: 1; display: flex; flex-direction: column;">
            <div class="play-header">
                <span id="hole-indicator">Hole 1 / 18</span>
                <span style="font-size:0.8rem; color:#666;">※1パットのみ</span>
            </div>
            
            <!-- 入力UI -->
            <div id="input-container" style="margin-bottom: 15px;"></div>

            <!-- 暫定純利益 -->
            <table class="mini-board">
                <thead>
                    <tr><th>名前</th><th>累計Pt</th><th>純利益</th></tr>
                </thead>
                <tbody id="mini-board-body"></tbody>
            </table>

            <button class="btn btn-submit" onclick="submitHole()">このホールを確定 (次へ)</button>
        </div>
    </div>

    <!-- 3. 最終結果画面 -->
    <div id="result-view" class="view">
        <div id="capture-area">
            <div class="card" style="margin-bottom: 0;">
                <h2>最終集計結果</h2>
                
                <!-- 18ホール詳細 -->
                <div style="overflow-x: auto;">
                    <table class="detail-table">
                        <thead id="detail-head"></thead>
                        <tbody id="detail-body"></tbody>
                    </table>
                </div>

                <!-- 最終清算 -->
                <table class="mini-board">
                    <thead>
                        <tr><th>名前</th><th>獲得Pt</th><th>純利益</th></tr>
                    </thead>
                    <tbody id="final-board-body"></tbody>
                </table>
            </div>
        </div>
        <button class="btn btn-save" onclick="saveAsImage()">結果を画像として保存</button>
    </div>

    <script>
        // 状態管理
        let players = [];
        let rate = 100;
        let currentHole = 1;
        const TOTAL_HOLES = 18;
        let activeMedals = [];
        
        // 履歴データ: history[holeIndex][playerIndex] = 獲得ポイント
        let historyData = [];
        // 現在のホールの入力状態
        let currentHoleSelection = [];

        function renderNameInputs() {
            const count = parseInt(document.getElementById('player-count').value);
            const container = document.getElementById('name-inputs-container');
            container.innerHTML = '';
            for(let i=0; i<count; i++) {
                container.innerHTML += `<input type="text" id="pname-${i}" placeholder="プレイヤー ${i+1} の名前" value="Player ${i+1}">`;
            }
        }

        // 動的配点ロジック（スライド方式）
        function generateMedals(count) {
            const medals = [];
            medals.push({ name: "ダ", val: count + 1, emoji: "💎" });
            const names = ["金", "銀", "銅", "鉄"];
            const emojis = ["🥇", "🥈", "🥉", "⚙️"];
            for (let i = 0; i < count; i++) {
                medals.push({ name: names[i], val: count - i, emoji: emojis[i] });
            }
            medals.push({ name: "なし", val: 0, emoji: "❌" }); // 0点オプション追加
            return medals;
        }

        function startGame() {
            const count = parseInt(document.getElementById('player-count').value);
            rate = parseInt(document.getElementById('rate').value);
            activeMedals = generateMedals(count);
            
            players = [];
            currentHoleSelection = [];
            for(let i=0; i<count; i++) {
                const name = document.getElementById(`pname-${i}`).value || `Player ${i+1}`;
                players.push({ index: i, name: name, totalPts: 0 });
                currentHoleSelection.push(0); // 初期値は全員0点
            }
            
            historyData = [];
            currentHole = 1;
            
            switchView('play-view');
            renderPlayScreen();
        }

        function renderPlayScreen() {
            document.getElementById('hole-indicator').innerText = `Hole ${currentHole} / ${TOTAL_HOLES}`;
            const container = document.getElementById('input-container');
            container.innerHTML = '';

            players.forEach((p, pIndex) => {
                let btns = activeMedals.map(m => {
                    const isSelected = currentHoleSelection[pIndex] === m.val;
                    return `<div class="medal-btn ${isSelected ? 'selected' : ''}" 
                                 onclick="selectMedal(${pIndex}, ${m.val})">
                                ${m.emoji}<br>${m.val > 0 ? m.val : '0'}
                            </div>`;
                }).join('');

                container.innerHTML += `
                    <div class="player-row">
                        <span class="player-name">${p.name}</span>
                        <div class="medal-grid">${btns}</div>
                    </div>
                `;
            });
            updateMiniBoard('mini-board-body');
        }

        function selectMedal(playerIndex, value) {
            currentHoleSelection[playerIndex] = value;
            renderPlayScreen();
        }

        function submitHole() {
            // 現在の入力値を履歴に保存し、総ポイントを加算
            historyData.push([...currentHoleSelection]);
            players.forEach((p, i) => { p.totalPts += currentHoleSelection[i]; });

            if (currentHole >= TOTAL_HOLES) {
                // ゲーム終了
                switchView('result-view');
                renderResultScreen();
            } else {
                // 次のホールへ
                currentHole++;
                currentHoleSelection = players.map(() => 0); // リセット
                renderPlayScreen();
            }
        }

        function calculateNet(playerIndex) {
            const count = players.length;
            const myPts = players[playerIndex].totalPts;
            const totalPts = players.reduce((sum, p) => sum + p.totalPts, 0);
            
            const earned = myPts * (count - 1) * rate;
            const paid = (totalPts - myPts) * rate;
            return earned - paid;
        }

        function updateMiniBoard(targetId) {
            const tbody = document.getElementById(targetId);
            tbody.innerHTML = '';
            players.forEach((p, i) => {
                const net = calculateNet(i);
                const netCls = net > 0 ? 'net-plus' : (net < 0 ? 'net-minus' : '');
                const netSign = net > 0 ? '+' : '';
                tbody.innerHTML += `<tr>
                    <td>${p.name}</td>
                    <td>${p.totalPts}</td>
                    <td class="${netCls}">${netSign}${net}</td>
                </tr>`;
            });
        }

        function renderResultScreen() {
            // 詳細テーブル生成
            const thead = document.getElementById('detail-head');
            const tbody = document.getElementById('detail-body');
            
            let headHtml = '<tr><th>Hole</th>';
            players.forEach(p => headHtml += `<th>${p.name}</th>`);
            headHtml += '</tr>';
            thead.innerHTML = headHtml;

            let bodyHtml = '';
            for(let h=0; h<TOTAL_HOLES; h++) {
                bodyHtml += `<tr><td>${h+1}</td>`;
                players.forEach((p, i) => {
                    const pt = historyData[h][i];
                    bodyHtml += `<td>${pt > 0 ? pt : '-'}</td>`;
                });
                bodyHtml += '</tr>';
            }
            tbody.innerHTML = bodyHtml;

            updateMiniBoard('final-board-body');
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // 画像として保存 (html2canvas使用)
        function saveAsImage() {
            const target = document.getElementById('capture-area');
            html2canvas(target, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'olympic_result.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 初期化
        renderNameInputs();
    </script>
</body>
</html>
