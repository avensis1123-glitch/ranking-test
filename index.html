```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スコア集計中...</title>
    <style>
        :root {
            --turf-color: #2d6a4f;
            --dirt-color: #9c6644;
            --text-main: #1b4332;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f0fdf4;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            background-color: var(--text-main);
            color: white;
            text-align: center;
            padding: 1rem 0;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .race-container {
            width: 95%;
            max-width: 800px;
            margin: 2rem auto;
            background-color: var(--turf-color);
            border-radius: 12px;
            padding: 1rem 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 10px 15px -3px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .track-line {
            height: 60px;
            background-color: var(--dirt-color);
            margin: 10px 0;
            position: relative;
            border-top: 2px dashed rgba(255,255,255,0.3);
            border-bottom: 2px dashed rgba(255,255,255,0.3);
        }

        .horse {
            font-size: 40px;
            position: absolute;
            left: -50px;
            top: 5px;
            transition: left 1s linear;
            /* scaleX(-1)で反転させるため、影のX方向を逆に調整 */
            filter: drop-shadow(-2px 4px 2px rgba(0,0,0,0.4));
            transform: scaleX(-1);
            display: inline-block;
        }

        /* 走っているように見せる上下のバウンドアニメーション（右向き反転を維持） */
        @keyframes gallop {
            0%, 100% { transform: scaleX(-1) translateY(0) rotate(0deg); }
            25% { transform: scaleX(-1) translateY(-5px) rotate(5deg); }
            50% { transform: scaleX(-1) translateY(0) rotate(0deg); }
            75% { transform: scaleX(-1) translateY(2px) rotate(-5deg); }
        }

        .galloping {
            animation: gallop 0.4s infinite;
        }
        
        .horse:nth-child(2) { animation-duration: 0.35s; }
        .horse:nth-child(3) { animation-duration: 0.45s; }

        .commentary-box {
            width: 95%;
            max-width: 800px;
            background-color: white;
            border: 4px solid var(--turf-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        .commentary-title {
            position: absolute;
            top: -15px;
            left: 20px;
            background-color: #dc2626;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;

            display: inline-block;
            width: 10px;

            animation: blink 1s step-end infinite;

            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header">⛳ スコア集計中...</div>

    <div class="race-container">
        <div class="track-line"><div class="horse galloping" id="horse1">🏇</div></div>
        <div class="track-line"><div class="horse galloping" id="horse2">🏇</div></div>
        <div class="track-line"><div class="horse galloping" id="horse3">🏇</div></div>
    </div>

    <div class="commentary-box">
        <div class="commentary-title">LIVE 実況</div>
        <div class="commentary-text">
            <span id="commentary-content">準備中...</span><span class="blinking-cursor"></span>
        </div>
    </div>

    <script>
        // 実況フェーズの定義
        const phases = [
            { text: "各プレイヤー、一斉にスタート！ただいまスコアカードを猛烈な勢いで回収中！", progress: 15, duration: 4000 },
            { text: "第1コーナーを回る！バーディ、ボギーが入り乱れる大混戦！計算機が唸りを上げております！", progress: 35, duration: 4000 },
            { text: "第3コーナーから第4コーナーへ！ペリア方式の隠しホールが牙を剥く！ハンデ調整で順位がわからなくなってきた！", progress: 55, duration: 5000 },
            { text: "さあ、最後の直線に入った！幹事の指先がキーボードの上を激しく舞う！", progress: 75, duration: 4000 },
            { text: "残り200メートル！集計完了まであとわずか！トップ集団のスコアが並んでいる！", progress: 85, duration: 4000 },
            { text: "残り100！あともう少し！最終確認中！...おっと、まだ計算が合わない！スコアカードの字が汚くて読めないぞぉぉぉ！もう一周だぁぁぁ！", progress: 110, duration: 5000 }
        ];

        const horses = [
            document.getElementById('horse1'),
            document.getElementById('horse2'),
            document.getElementById('horse3')
        ];
        const commentaryContent = document.getElementById('commentary-content');
        
        let isRunning = true;
        let currentPhase = 0;

        // 指定ミリ秒待機するユーティリティ
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // 馬の位置を更新する関数
        // progressは基準となる進行度（%）。各馬に少しランダムなブレを持たせる。
        function updateHorses(progress, transitionTime) {
            horses.forEach((horse) => {
                // アニメーション時間を動的に設定
                horse.style.transition = `left ${transitionTime}ms linear`;
                
                if (progress >= 110) {
                    // ループ時は画面外まで走り抜ける
                    const randomOffset = Math.random() * 20;
                    horse.style.left = `calc(${progress + randomOffset}% + 50px)`;
                } else if (progress === 0) {
                    // スタート位置へリセット（アニメーションを切って即座に移動）
                    horse.style.transition = 'none';
                    horse.style.left = '-50px';
                } else {
                    // 通常の進行
                    // 基準位置に対して-5%〜+5%のランダムな位置変動（抜きつ抜かれつを演出）
                    const randomFluctuation = (Math.random() * 10) - 5;
                    let targetPos = progress + randomFluctuation;
                    // 画面外に出ないように制限
                    targetPos = Math.max(5, Math.min(targetPos, 90));
                    horse.style.left = `calc(${targetPos}% - 30px)`;
                }
            });
        }

        // 実況テキストを一文字ずつ表示する演出
        async function typeWriterEffect(text) {
            commentaryContent.textContent = '';
            for (let i = 0; i < text.length; i++) {
                if (!isRunning) return; // 完了ボタンが押されたら即中断
                commentaryContent.textContent += text.charAt(i);
                await sleep(30); // 1文字あたりの表示速度
            }
        }

        async function startRaceLoop() {
            while (isRunning) {
                // フェーズを順に実行
                for (let i = 0; i < phases.length; i++) {
                    if (!isRunning) break;
                    
                    const phase = phases[i];
                    
                    // 馬を移動させる
                    updateHorses(phase.progress, phase.duration);
                    
                    // 実況テキストを更新
                    // awaitを付けずに非同期で実行し、指定時間(duration)待つ間にタイピング演出が終わるようにする
                    typeWriterEffect(phase.text);
                    
                    // 次のフェーズまでの待機時間
                    let elapsed = 0;
                    const checkInterval = 100;
                    while(elapsed < phase.duration) {
                        if (!isRunning) return; // 待機中も終了フラグを監視
                        await sleep(checkInterval);
                        elapsed += checkInterval;
                    }
                }

                if (!isRunning) break;

                // ループ完了時（もう一周だぁぁぁ！の後）
                await sleep(500); // 画面外に走り抜けるのを少し待つ
                
                // 位置をリセット（アニメーションなし）
                updateHorses(0, 0);
                
                // リセットがブラウザに反映されるのを待つため1フレーム待機
                await sleep(50);
            }
        }

        // ページ読み込み完了時にループ開始
        window.onload = () => {
            startRaceLoop();
        };
    </script>
</body>
</html>
